<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <META HTTP-EQUIV="CACHE-CONTROL" CONTENT="NO-CACHE">
    <title>Volleyball Scoring</title>

    <!-- Progressive Web App: lets phones install this as an app -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SideOut">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- The version (year.month.day-hourminute) is set by .githooks/pre-commit on each commit.
         It is part of every file address below, so a new version never loads an old cached file. -->
    <script>const APP_VERSION = '2026.11.06-2240';</script>
    <link rel="stylesheet" href="styles.css?v=2026.11.06-2240">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
    <div id="menuOverlay" class="menu-overlay">
        <div class="menu-content">
            <div class="menu-header">
                <h2>Settings</h2>
                <span class="menu-close" onclick="toggleMenu()">✖</span>
            </div>

            <div class="menu-actions">
                <button class="menu-btn menu-btn-primary" onclick="openFinalSet()">End Set</button>
                <button class="menu-btn" onclick="openHistory()">History</button>
            </div>

            <div class="menu-section scoring-section">
                <div class="menu-label">Scoring</div>
                <div class="segmented" role="group" aria-label="Scoring type">
                    <button id="scoreTypeSideout" onclick="setScoringType('sideout')">Side Out</button>
                    <button id="scoreTypeRally" onclick="setScoringType('rally')">Rally</button>
                </div>
                <!-- Hidden: holds the chosen scoring type for the rest of the code -->
                <select id="scoringType" hidden>
                    <option value="sideout">Side Out</option>
                    <option value="rally">Rally</option>
                </select>
            </div>

            <div class="menu-section teams-section">
                <div class="menu-label">Teams and score</div>
                <div class="team-row">
                    <span class="team-swatch blue"></span>
                    <input type="text" id="team1" placeholder="Team A" oninput="updateTeamAName()" aria-label="Blue team name">
                    <button class="step-btn" onclick="adjustScore('A', -1)" aria-label="Blue team minus one">−</button>
                    <span id="adjustScoreA" class="step-value">0</span>
                    <button class="step-btn" onclick="adjustScore('A', 1)" aria-label="Blue team plus one">+</button>
                </div>
                <div class="team-row">
                    <span class="team-swatch red"></span>
                    <input type="text" id="team2" placeholder="Team B" oninput="updateTeamBName()" aria-label="Red team name">
                    <button class="step-btn" onclick="adjustScore('B', -1)" aria-label="Red team minus one">−</button>
                    <span id="adjustScoreB" class="step-value">0</span>
                    <button class="step-btn" onclick="adjustScore('B', 1)" aria-label="Red team plus one">+</button>
                </div>
            </div>

            <button class="menu-reset" onclick="resetScores()">Reset score</button>
            <p id="appVersion" class="app-version"></p>
        </div>
    </div>
    
    <div id="lblTeam2"></div>

    <!-- Which set is being played. Tap it for End Set and History. -->
    <button id="setLabel" class="set-label" onclick="toggleSetMenu()">Set 1</button>
    <div id="setMenuBackdrop" class="set-menu-backdrop" onclick="closeSetMenu()"></div>
    <div id="setMenu" class="set-menu">
        <button onclick="closeSetMenu(); openFinalSet()">End Set</button>
        <button onclick="closeSetMenu(); openHistory()">History</button>
    </div>

    <!-- End Set box: save this set, then start the next set or end the match -->
    <div id="finalOverlay" class="dialog-overlay">
        <div class="dialog-box">
            <h3 id="finalTitle">End set 1</h3>
            <div id="finalGrid"></div>
            <p id="finalMatch" class="final-match"></p>
            <div id="finalButtons" class="dialog-buttons">
                <button class="dialog-btn dialog-btn-primary" onclick="recordSet(false)">Next set</button>
                <button class="dialog-btn" onclick="recordSet(true)">End match</button>
                <button class="dialog-btn dialog-btn-plain" onclick="closeFinalSet()">Cancel</button>
            </div>
            <div id="finalTiedButtons" class="dialog-buttons">
                <button class="dialog-btn dialog-btn-primary" onclick="closeFinalSet()">OK</button>
            </div>
        </div>
    </div>

    <!-- History page: past matches as line-score grids -->
    <div id="historyPage" class="dialog-overlay">
        <div class="history-box">
            <div class="history-header">
                <h2>Match history</h2>
                <span class="menu-close" onclick="closeHistory()">✖</span>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <div class="switcher" onclick="switchDivs()"><i style="font-size:50px;color:darkgray" class="fa">&#xf021;</i></div>

    <div class="container"> 

        <button id="scoreA" class="score-button blue" onclick="increaseScore('A')"><div name="team1" id="teamName">test 1</div><span>0</span></button>
        <button id="scoreB" class="score-button red" onclick="increaseScore('B')"><div name="team2" id="teamName">test 2</div><span>0</span></button>
    </div>
    <script src="script.js?v=2026.11.06-2240"></script>
    <script>
        // Register the service worker so the app works offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=' + APP_VERSION);
        }
    </script>
</body>
</html>
